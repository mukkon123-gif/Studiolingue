<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palestra delle Lingue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#1C1F2A;
    --ink-light:#282C3A;
    --ink-hover:#333849;
    --paper:#FBF8F2;
    --card:#FFFFFF;
    --hairline:#E6E0D2;
    --text:#211F1C;
    --text-muted:#78716A;
    --text-faint:#A69F92;

    --ar:#C9A227;
    --zh:#B23A2E;
    --el:#2C5F82;
    --de:#3E5C4E;
    --es:#D98E3F;
    --fr:#8C4A5E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--acc,#2C5F82);outline-offset:2px;}

  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:236px;flex-shrink:0;background:var(--ink);
    display:flex;flex-direction:column;padding:28px 14px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{
    padding:0 10px 22px 10px;color:#EFEAE0;
  }
  .brand .display{font-size:20px;line-height:1.15;color:#F4F0E6;}
  .brand .sub{font-size:11.5px;color:#8A8F9E;margin-top:4px;letter-spacing:.03em;}
  .nav-group{margin-top:10px;}
  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#6E7385;padding:6px 12px;margin-top:12px;}
  .nav-btn{
    width:100%;display:flex;align-items:center;gap:12px;
    background:transparent;border:none;border-radius:10px;
    padding:9px 10px;margin-bottom:3px;color:#D6D2C4;text-align:left;
    transition:background .15s ease;position:relative;
  }
  .nav-btn:hover{background:var(--ink-light);}
  .nav-btn.active{background:var(--ink-hover);}
  .nav-btn .glyph{
    width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif',serif;font-size:16px;font-weight:700;
    background:rgba(255,255,255,.06);flex-shrink:0;
  }
  .nav-btn .label{font-size:13.5px;font-weight:500;flex:1;}
  .nav-btn .dot{
    width:7px;height:7px;border-radius:50%;background:#E8C15A;
    animation:pulse 1.4s infinite;flex-shrink:0;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* Main */
  .main{flex:1;min-width:0;}
  .accent-bar{height:3px;width:100%;}
  .page{padding:40px 48px 80px 48px;max-width:1040px;}
  .page-head{margin-bottom:30px;}
  .page-head .glyph-big{
    font-family:'Noto Serif',serif;font-size:34px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;
    width:54px;height:54px;border-radius:12px;margin-right:14px;
    color:#fff;vertical-align:middle;
  }
  .page-head h1{font-size:30px;margin:0;display:inline-block;vertical-align:middle;}
  .page-head p{color:var(--text-muted);font-size:14px;margin:10px 0 0 68px;max-width:520px;}

  .card{
    background:var(--card);border:1px solid var(--hairline);border-radius:14px;
    padding:22px 24px;margin-bottom:22px;
  }
  .card h2{font-size:16px;margin:0 0 16px 0;}
  .card h2 .n{color:var(--text-faint);font-weight:400;font-size:13px;margin-left:6px;}

  .summary-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;}
  .stat{
    flex:1;min-width:130px;background:var(--card);border:1px solid var(--hairline);
    border-radius:12px;padding:14px 16px;
  }
  .stat .num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;}
  .stat .lbl{font-size:11.5px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;}

  form.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
  .field input,.field select,.field textarea{
    border:1px solid var(--hairline);border-radius:8px;padding:9px 10px;
    font-size:14px;background:#fff;color:var(--text);min-width:150px;
  }
  .field textarea{min-width:260px;min-height:60px;resize:vertical;}
  .field.grow{flex:1;}

  .btn{
    border:1px solid var(--hairline);background:#fff;border-radius:8px;
    padding:9px 16px;font-size:13.5px;font-weight:500;color:var(--text);
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:#F5F2EA;}
  .btn:active{transform:scale(.97);}
  .btn-primary{color:#fff;border:none;}
  .btn-danger{background:transparent;border:none;color:var(--text-faint);font-size:12px;padding:2px 6px;}
  .btn-danger:hover{color:#B23A2E;background:transparent;}
  .btn-ghost{background:transparent;border:1px solid var(--hairline);}

  /* Stile per il pulsante "Torna alla Scrivania" */
  .back-btn:hover { background: #333849 !important; }

  .family-group{margin-bottom:18px;}
  .family-group h3{
    font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);
    font-family:'Inter',sans-serif;font-weight:600;margin:0 0 10px 0;
    display:flex;align-items:center;gap:8px;
  }
  .family-group h3 .count{font-family:'JetBrains Mono',monospace;color:var(--text-faint);font-weight:400;}
  .word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
  .word-card{
    border:1px solid var(--hairline);border-radius:10px;padding:11px 12px;position:relative;background:#FEFDFA;
  }
  .word-card .term{font-family:'Noto Serif',serif;font-size:17px;font-weight:600;}
  .word-card .term.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right;font-size:19px;}
  .word-card .term.zh{font-family:'Noto Serif SC',serif;}
  .word-card .transl{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .word-card .note{font-size:11.5px;color:var(--text-faint);margin-top:5px;font-style:italic;}
  .word-card .actions{position:absolute;top:4px;right:4px;display:flex;gap:2px;}
  .speak-btn{background:transparent;border:none;color:var(--text-faint);font-size:13px;padding:2px 4px;border-radius:6px;}
  .speak-btn:hover{background:#F0ECE0;color:var(--text);}

  .trace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .trace-tile{border:1px solid var(--hairline);border-radius:10px;padding:10px;background:#FEFDFA;position:relative;}
  .trace-svg{width:100%;height:auto;display:block;}
  .trace-cap{font-size:13px;font-weight:600;margin-top:2px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
  .trace-cap .trace-name{font-weight:400;color:var(--text-muted);font-size:11px;}
  .trace-howto{font-size:10.5px;color:var(--text-faint);text-align:center;margin-top:4px;line-height:1.35;}

  .grammar-item{border:1px solid var(--hairline);border-radius:10px;padding:12px 14px;margin-bottom:9px;position:relative;}
  .grammar-item h4{margin:0 0 4px 0;font-size:14px;font-family:'Fraunces',serif;font-weight:600;}
  .grammar-item p{margin:0;font-size:13.5px;color:var(--text-muted);white-space:pre-wrap;line-height:1.5;}
  .grammar-item.rtl h4, .grammar-item.rtl p{direction:rtl;text-align:right;font-family:'Noto Naskh Arabic',serif;}

  .timer-box{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .timer-display{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600;min-width:130px;}
  .timer-status{font-size:12px;color:var(--text-muted);}

  table.sessions{width:100%;border-collapse:collapse;font-size:13px;}
  table.sessions th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:6px 8px;border-bottom:1px solid var(--hairline);}
  table.sessions td{padding:8px;border-bottom:1px solid var(--hairline);}
  table.sessions td.num{font-family:'JetBrains Mono',monospace;}

  .empty-state{color:var(--text-faint);font-size:13.5px;padding:14px 2px;}

  /* Home */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .home-card{
    border:1px solid var(--hairline);border-radius:14px;padding:20px;background:var(--card);
    cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;text-align:left;
  }
  .home-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,25,15,.07);}
  .home-card .glyph{
    width:44px;height:44px;border-radius:10px;color:#fff;font-family:'Noto Serif',serif;
    font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px;
  }
  .home-card h3{margin:0 0 4px 0;font-size:16px;}
  .home-card .meta{font-size:12.5px;color:var(--text-muted);}

  /* Spanish table */
  .ff-wrap{overflow-x:auto;}
  table.ff{border-collapse:collapse;}
  table.ff th{
    text-align:left;padding:9px 16px;font-size:11px;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:.04em;background:#F7F4EC;white-space:nowrap;
  }
  table.ff td{padding:9px 16px;border-bottom:1px solid var(--hairline);white-space:nowrap;font-size:14.5px;}
  table.ff tr:first-child td{font-weight:600;font-family:'Fraunces',serif;}
  table.ff tr.actions td{padding-top:4px;}

  /* French */
  .rec-btn{
    display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:30px;
    border:none;color:#fff;font-size:14px;font-weight:600;
  }
  .rec-dot{width:10px;height:10px;border-radius:50%;background:#fff;}
  .rec-dot.on{animation:pulse .9s infinite;}
  .transcript-box{border:1px dashed var(--hairline);border-radius:10px;padding:14px;margin-top:14px;font-size:14px;min-height:44px;white-space:pre-wrap;}
  .photo-drop{
    border:1.5px dashed var(--hairline);border-radius:12px;padding:26px;text-align:center;color:var(--text-muted);
    font-size:13.5px;cursor:pointer;
  }
  .photo-drop:hover{background:#F7F4EC;}
  .record-history .item{border-bottom:1px solid var(--hairline);padding:10px 0;font-size:13.5px;}
  .record-history .item .date{font-size:11px;color:var(--text-faint);margin-bottom:3px;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{
      width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;
      padding:14px 10px;gap:4px;
    }
    .brand{display:none;}
    .nav-group{display:flex;margin-top:0;}
    .nav-label{display:none;}
    .nav-btn{width:auto;margin-right:4px;padding:8px;}
    .nav-btn .label{display:none;}
    .page{padding:26px 18px 60px 18px;}
    .page-head p{margin-left:0;margin-top:12px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px;}
  .login-card{background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:34px 30px;max-width:360px;width:100%;}
  .login-card h1{font-size:22px;margin:0 0 6px 0;}
  .login-card p{font-size:13px;color:var(--text-muted);margin:0 0 20px 0;}
  .login-card .field{margin-bottom:12px;}
  .login-card input{width:100%;}
  .login-card .btn{width:100%;text-align:center;margin-top:6px;}
  .login-error{color:#B23A2E;font-size:12.5px;margin-top:10px;min-height:16px;}
  .user-chip{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;margin:4px 0 12px 0;background:var(--ink-light);border-radius:8px;}
  .user-chip span{font-size:11.5px;color:#B9BECC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
  .user-chip button{background:none;border:none;color:#8A8F9E;font-size:11px;text-decoration:underline;padding:0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------------------------------------------------------
   SUPABASE CONFIG
--------------------------------------------------------------- */
const SUPABASE_URL = 'https://xtnsuakzdwzhprmhdnhb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_KVxr6ltrIYSNk4eqvjA2fg_FraZzyOh';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------------------------------------------------------
   LANGS & FAMILIES
--------------------------------------------------------------- */
const LANGS = {
  ar:{name:'Arabo',        glyph:'ا',  accent:'#C9A227', rtl:true,  termFont:'ar'},
  zh:{name:'Cinese',       glyph:'汉', accent:'#B23A2E', rtl:false, termFont:'zh'},
  el:{name:'Greco Moderno',glyph:'Ω',  accent:'#2C5F82', rtl:false, termFont:''},
  de:{name:'Tedesco',      glyph:'ß',  accent:'#3E5C4E', rtl:false, termFont:''},
  es:{name:'Spagnolo',     glyph:'Ñ',  accent:'#D98E3F', rtl:false},
  fr:{name:'Francese',     glyph:'Ç',  accent:'#8C4A5E', rtl:false},
};
const CORE_LANGS = ['ar','zh','el','de'];

const FAMILIES = [
  {id:'pronomi',      label:'Pronomi e Dimostrativi'},
  {id:'verbi',         label:'Verbi Fondamentali'},
  {id:'connettori',    label:'Connettori e Congiunzioni'},
  {id:'interrogative', label:'Parole Interrogative'},
  {id:'tempo-spazio',  label:'Tempo e Spazio'},
  {id:'aggettivi',     label:'Aggettivi di Base'},
  {id:'quantita',      label:'Quantità e Modificatori'},
  {id:'sopravvivenza', label:'Sostantivi di Sopravvivenza'},
  {id:'cortesia',      label:'Cortesia e Particelle'},
];

/* ---------------------------------------------------------------
   SEED WORDS, GRAMMAR, NOTEBOOK, ETC (DAI DATI PRECEDENTI)
--------------------------------------------------------------- */
const SEED_WORDS = { /* MANTIENI I TUOI DATI */ };
const SEED_GRAMMAR = { /* MANTIENI I TUOI DATI */ };
const NOTEBOOK_INFO = { /* MANTIENI I TUOI DATI */ };
const SPEECH_LANG = { ar:'ar-SA', zh:'zh-CN', el:'el-GR', de:'de-DE', es:'es-ES', fr:'fr-FR' };

// ... (Tutte le altre funzioni di sintesi, direzioni e tracciamento base restano invariate) ...

/* ---------------------------------------------------------------
   GUIDED TRACE SETUP (NUOVA GUIDA DIDATTICA)
--------------------------------------------------------------- */
const GUIDED_TRACE = {
  zh: {
    "人": [ { path: "M60,20 L45,90", x: 60, y: 20, num: 1 }, { path: "M60,20 L75,90", x: 60, y: 20, num: 2 } ],
    "日": [ { path: "M40,30 L80,30", x: 40, y: 30, num: 1 }, { path: "M40,30 L40,90", x: 40, y: 30, num: 2 }, { path: "M80,30 L80,90", x: 80, y: 30, num: 3 }, { path: "M40,90 L80,90", x: 40, y: 90, num: 4 } ]
  },
  el: {
    "Α": [ { path: "M50,90 L40,20", x: 50, y: 90, num: 1 }, { path: "M40,20 L70,90", x: 40, y: 20, num: 2 }, { path: "M38,50 L62,50", x: 38, y: 50, num: 3 } ]
  },
  ar: {
    "ب": [ { path: "M30,70 L70,70", x: 30, y: 70, num: 1 }, { path: "M50,70 L50,30", x: 50, y: 70, num: 2 } ]
  }
};

function tracingTile(entry, code, accent, idx, style){
  style = style || 'new';
  const [ch, name, sound, howto] = entry;
  const markerId = 'arrowhead-'+code+'-'+idx;
  const isGrid = code==='zh';
  const guide = isGrid ? `
      <rect x="10" y="14" width="100" height="100" fill="none" stroke="#C9C2AF" stroke-width="1.5"/>
      <line x1="60" y1="14" x2="60" y2="114" stroke="#D8D2C0" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="10" y1="64" x2="110" y2="64" stroke="#D8D2C0" stroke-width="1" stroke-dasharray="4 3"/>` : `
      <line x1="8" y1="28" x2="112" y2="28" stroke="#D8D2C0" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="8" y1="72" x2="112" y2="72" stroke="#D8D2C0" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="8" y1="110" x2="112" y2="110" stroke="#B7AF9C" stroke-width="1.5"/>`;
  const textY = isGrid ? 92 : 104;

  let arrowSvg, dashColor;
  const strokes = GUIDED_TRACE[code] && GUIDED_TRACE[code][ch];

  if (strokes && strokes.length > 0) {
    arrowSvg = strokes.map(s => `
      <path d="${s.path}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round" marker-end="url(#${markerId})"/>
      <circle cx="${s.x}" cy="${s.y}" r="7.5" fill="#fff" stroke="${accent}" stroke-width="1.5"/>
      <text x="${s.x}" y="${s.y+3.2}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${accent}" font-family="'Inter',sans-serif">${s.num}</text>
    `).join('');
    dashColor = TRACE_DASH_NEW;
  } else {
    dashColor = TRACE_DASH_NEW;
    const arrowDir = directionArrow(howto);
    const {d:arrowD, sx, sy} = arrowGeometryInside(arrowDir, textY);
    arrowSvg = `
      <path d="${arrowD}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round" marker-end="url(#${markerId})"/>
      <circle cx="${sx}" cy="${sy}" r="7.5" fill="#fff" stroke="${accent}" stroke-width="1.5"/>
      <text x="${sx}" y="${sy+3.2}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${accent}" font-family="'Inter',sans-serif">1</text>`;
  }

  return `
    <div class="trace-tile">
      <svg viewBox="0 0 120 122" class="trace-svg">
        <defs>
          <marker id="${markerId}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="${accent}"/>
          </marker>
        </defs>
        ${guide}
        <text x="60" y="${textY}" text-anchor="middle" font-family="${TRACE_FONT[code]}" font-size="62" fill="none" stroke="${dashColor}" stroke-width="1.3" stroke-dasharray="3 3">${escapeHtml(ch)}</text>
        ${arrowSvg}
      </svg>
      <div class="trace-cap">${escapeHtml(ch)} <span class="trace-name">${escapeHtml(name)}</span>
        <button class="speak-btn" data-speak="${escapeHtml(ch)}" data-speak-lang="${code}" title="Ascolta">🔊</button>
      </div>
      <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:2px;">${escapeHtml(sound)}</div>
      <div class="trace-howto">${escapeHtml(howto)}</div>
    </div>`;
}

// ... (RESTANTE LOGICA APP: ROUTER, SHELL, HOME, LANGPAGE, SPANISH, FRENCH, LOGIN, INIT) ...
// Assicurati di incollare qui tutto il resto del codice dal tuo file precedente.

initAuthAndApp();
</script>
