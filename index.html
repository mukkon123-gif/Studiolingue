<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palestra delle Lingue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1C1F2A;
    --ink-light:#282C3A;
    --ink-hover:#333849;
    --paper:#FBF8F2;
    --card:#FFFFFF;
    --hairline:#E6E0D2;
    --text:#211F1C;
    --text-muted:#78716A;
    --text-faint:#A69F92;

    --ar:#C9A227;
    --zh:#B23A2E;
    --el:#2C5F82;
    --de:#3E5C4E;
    --es:#D98E3F;
    --fr:#8C4A5E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--acc,#2C5F82);outline-offset:2px;}

  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:236px;flex-shrink:0;background:var(--ink);
    display:flex;flex-direction:column;padding:28px 14px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{
    padding:0 10px 22px 10px;color:#EFEAE0;
  }
  .brand .display{font-size:20px;line-height:1.15;color:#F4F0E6;}
  .brand .sub{font-size:11.5px;color:#8A8F9E;margin-top:4px;letter-spacing:.03em;}
  .nav-group{margin-top:10px;}
  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#6E7385;padding:6px 12px;margin-top:12px;}
  .nav-btn{
    width:100%;display:flex;align-items:center;gap:12px;
    background:transparent;border:none;border-radius:10px;
    padding:9px 10px;margin-bottom:3px;color:#D6D2C4;text-align:left;
    transition:background .15s ease;position:relative;
  }
  .nav-btn:hover{background:var(--ink-light);}
  .nav-btn.active{background:var(--ink-hover);}
  .nav-btn .glyph{
    width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif',serif;font-size:16px;font-weight:700;
    background:rgba(255,255,255,.06);flex-shrink:0;
  }
  .nav-btn .label{font-size:13.5px;font-weight:500;flex:1;}
  .nav-btn .dot{
    width:7px;height:7px;border-radius:50%;background:#E8C15A;
    animation:pulse 1.4s infinite;flex-shrink:0;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* Main */
  .main{flex:1;min-width:0;}
  .accent-bar{height:3px;width:100%;}
  .page{padding:40px 48px 80px 48px;max-width:1040px;}
  .page-head{margin-bottom:30px;}
  .page-head .glyph-big{
    font-family:'Noto Serif',serif;font-size:34px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;
    width:54px;height:54px;border-radius:12px;margin-right:14px;
    color:#fff;vertical-align:middle;
  }
  .page-head h1{font-size:30px;margin:0;display:inline-block;vertical-align:middle;}
  .page-head p{color:var(--text-muted);font-size:14px;margin:10px 0 0 68px;max-width:520px;}

  .card{
    background:var(--card);border:1px solid var(--hairline);border-radius:14px;
    padding:22px 24px;margin-bottom:22px;
  }
  .card h2{font-size:16px;margin:0 0 16px 0;}
  .card h2 .n{color:var(--text-faint);font-weight:400;font-size:13px;margin-left:6px;}

  .summary-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;}
  .stat{
    flex:1;min-width:130px;background:var(--card);border:1px solid var(--hairline);
    border-radius:12px;padding:14px 16px;
  }
  .stat .num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;}
  .stat .lbl{font-size:11.5px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;}

  form.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
  .field input,.field select,.field textarea{
    border:1px solid var(--hairline);border-radius:8px;padding:9px 10px;
    font-size:14px;background:#fff;color:var(--text);min-width:150px;
  }
  .field textarea{min-width:260px;min-height:60px;resize:vertical;}
  .field.grow{flex:1;}

  .btn{
    border:1px solid var(--hairline);background:#fff;border-radius:8px;
    padding:9px 16px;font-size:13.5px;font-weight:500;color:var(--text);
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:#F5F2EA;}
  .btn:active{transform:scale(.97);}
  .btn-primary{color:#fff;border:none;}
  .btn-danger{background:transparent;border:none;color:var(--text-faint);font-size:12px;padding:2px 6px;}
  .btn-danger:hover{color:#B23A2E;background:transparent;}
  .btn-ghost{background:transparent;border:1px solid var(--hairline);}

  .family-group{margin-bottom:18px;}
  .family-group h3{
    font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);
    font-family:'Inter',sans-serif;font-weight:600;margin:0 0 10px 0;
    display:flex;align-items:center;gap:8px;
  }
  .family-group h3 .count{font-family:'JetBrains Mono',monospace;color:var(--text-faint);font-weight:400;}
  .word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
  .word-card{
    border:1px solid var(--hairline);border-radius:10px;padding:11px 12px;position:relative;background:#FEFDFA;
  }
  .word-card .term{font-family:'Noto Serif',serif;font-size:17px;font-weight:600;}
  .word-card .term.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right;font-size:19px;}
  .word-card .term.zh{font-family:'Noto Serif SC',serif;}
  .word-card .transl{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .word-card .note{font-size:11.5px;color:var(--text-faint);margin-top:5px;font-style:italic;}
  .word-card .actions{position:absolute;top:4px;right:4px;display:flex;gap:2px;}
  .speak-btn{background:transparent;border:none;color:var(--text-faint);font-size:13px;padding:2px 4px;border-radius:6px;}
  .speak-btn:hover{background:#F0ECE0;color:var(--text);}

  .trace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .trace-tile{border:1px solid var(--hairline);border-radius:10px;padding:10px;background:#FEFDFA;position:relative;}
  .trace-svg{width:100%;height:auto;display:block;}
  .trace-cap{font-size:13px;font-weight:600;margin-top:2px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
  .trace-cap .trace-name{font-weight:400;color:var(--text-muted);font-size:11px;}
  .trace-howto{font-size:10.5px;color:var(--text-faint);text-align:center;margin-top:4px;line-height:1.35;}

  .grammar-item{border:1px solid var(--hairline);border-radius:10px;padding:12px 14px;margin-bottom:9px;position:relative;}
  .grammar-item h4{margin:0 0 4px 0;font-size:14px;font-family:'Fraunces',serif;font-weight:600;}
  .grammar-item p{margin:0;font-size:13.5px;color:var(--text-muted);white-space:pre-wrap;line-height:1.5;}
  .grammar-item.rtl h4, .grammar-item.rtl p{direction:rtl;text-align:right;font-family:'Noto Naskh Arabic',serif;}

  .timer-box{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .timer-display{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600;min-width:130px;}
  .timer-status{font-size:12px;color:var(--text-muted);}

  table.sessions{width:100%;border-collapse:collapse;font-size:13px;}
  table.sessions th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:6px 8px;border-bottom:1px solid var(--hairline);}
  table.sessions td{padding:8px;border-bottom:1px solid var(--hairline);}
  table.sessions td.num{font-family:'JetBrains Mono',monospace;}

  .empty-state{color:var(--text-faint);font-size:13.5px;padding:14px 2px;}

  /* Home */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .home-card{
    border:1px solid var(--hairline);border-radius:14px;padding:20px;background:var(--card);
    cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;text-align:left;
  }
  .home-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,25,15,.07);}
  .home-card .glyph{
    width:44px;height:44px;border-radius:10px;color:#fff;font-family:'Noto Serif',serif;
    font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px;
  }
  .home-card h3{margin:0 0 4px 0;font-size:16px;}
  .home-card .meta{font-size:12.5px;color:var(--text-muted);}

  /* Spanish table */
  .ff-wrap{overflow-x:auto;}
  table.ff{border-collapse:collapse;}
  table.ff th{
    text-align:left;padding:9px 16px;font-size:11px;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:.04em;background:#F7F4EC;white-space:nowrap;
  }
  table.ff td{padding:9px 16px;border-bottom:1px solid var(--hairline);white-space:nowrap;font-size:14.5px;}
  table.ff tr:first-child td{font-weight:600;font-family:'Fraunces',serif;}
  table.ff tr.actions td{padding-top:4px;}

  /* French */
  .rec-btn{
    display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:30px;
    border:none;color:#fff;font-size:14px;font-weight:600;
  }
  .rec-dot{width:10px;height:10px;border-radius:50%;background:#fff;}
  .rec-dot.on{animation:pulse .9s infinite;}
  .transcript-box{border:1px dashed var(--hairline);border-radius:10px;padding:14px;margin-top:14px;font-size:14px;min-height:44px;white-space:pre-wrap;}
  .photo-drop{
    border:1.5px dashed var(--hairline);border-radius:12px;padding:26px;text-align:center;color:var(--text-muted);
    font-size:13.5px;cursor:pointer;
  }
  .photo-drop:hover{background:#F7F4EC;}
  .record-history .item{border-bottom:1px solid var(--hairline);padding:10px 0;font-size:13.5px;}
  .record-history .item .date{font-size:11px;color:var(--text-faint);margin-bottom:3px;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{
      width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;
      padding:14px 10px;gap:4px;
    }
    .brand{display:none;}
    .nav-group{display:flex;margin-top:0;}
    .nav-label{display:none;}
    .nav-btn{width:auto;margin-right:4px;padding:8px;}
    .nav-btn .label{display:none;}
    .page{padding:26px 18px 60px 18px;}
    .page-head p{margin-left:0;margin-top:12px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px;}
  .login-card{background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:34px 30px;max-width:360px;width:100%;}
  .login-card h1{font-size:22px;margin:0 0 6px 0;}
  .login-card p{font-size:13px;color:var(--text-muted);margin:0 0 20px 0;}
  .login-card .field{margin-bottom:12px;}
  .login-card input{width:100%;}
  .login-card .btn{width:100%;text-align:center;margin-top:6px;}
  .login-error{color:#B23A2E;font-size:12.5px;margin-top:10px;min-height:16px;}
  .user-chip{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;margin:4px 0 12px 0;background:var(--ink-light);border-radius:8px;}
  .user-chip span{font-size:11.5px;color:#B9BECC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
  .user-chip button{background:none;border:none;color:#8A8F9E;font-size:11px;text-decoration:underline;padding:0;}
</style>
</head>

const SPEECH_LANG = { ar:'ar-SA', zh:'zh-CN', el:'el-GR', de:'de-DE', es:'es-ES', fr:'fr-FR' };

// ---------- SINTESI VOCALE (OTTIMIZZATA PER FIREFOX) ----------
function speakWord(text, code) {
    if (!('speechSynthesis' in window)) {
        showToast('Il tuo browser non supporta la sintesi vocale.');
        return;
    }

    const synth = window.speechSynthesis;

    // Ferma qualsiasi audio in riproduzione
    if (synth.speaking || synth.pending) {
        synth.cancel();
    }

    // La funzione che effettivamente pronuncia il testo
    const doSpeak = () => {
        // Piccolo ritardo per permettere al browser di "resetare" correttamente (fondamentale per Firefox)
        setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = SPEECH_LANG[code] || 'it-IT';
            utterance.rate = 0.85;
            utterance.pitch = 1;

            // Prova a selezionare una voce specifica per quella lingua
            const voices = synth.getVoices();
            const langPrefix = utterance.lang.split('-')[0];
            const preferred = voices.find(v => v.lang.startsWith(langPrefix));
            if (preferred) utterance.voice = preferred;

            utterance.onerror = (e) => {
                console.error('Errore sintesi vocale:', e.error);
                showToast('Voce non disponibile per questa lingua sul tuo dispositivo.');
            };

            synth.speak(utterance);
        }, 80);
    };

    // ***** TRUCCO PER FIREFOX *****
    // Se le voci non sono ancora state caricate, aspetta l'evento 'voiceschanged'
    if (synth.getVoices().length === 0) {
        // Imposta un ascoltatore che partirà quando le voci saranno pronte
        const handler = () => {
            doSpeak();
            // Rimuovi l'ascoltatore per evitare che venga chiamato più volte
            synth.onvoiceschanged = null;
        };
        synth.onvoiceschanged = handler;

        // Se le voci non arrivano entro 2 secondi, prova a parlare comunque (fallback)
        setTimeout(() => {
            if (synth.onvoiceschanged === handler) {
                synth.onvoiceschanged = null;
                doSpeak();
            }
        }, 2000);
    } else {
        // Le voci sono già caricate, parla subito
        doSpeak();
    }
}

// (La vecchia speakWithBrowser non serve più, la teniamo vuota)
function speakWithBrowser(text, code) {
    speakWord(text, code);
}

// Forza il caricamento delle voci all'avvio
if ('speechSynthesis' in window) {
    const synth = window.speechSynthesis;
    const voices = synth.getVoices();
    if (voices.length === 0) {
        synth.onvoiceschanged = () => { synth.getVoices(); };
    }
}

function directionArrow(howto){
  const h = (howto||'').toLowerCase();
  if(h.includes('antiorario')) return 'ccw';
  if(h.includes('orario')) return 'cw';
  if(h.includes('destra a sinistra')) return 'left';
  if(h.includes('sinistra a destra')) return 'right';
  if(h.includes("dall'alto") || h.includes('verso il basso') || h.includes('scende')) return 'down';
  if(h.includes("verso l'alto") || h.includes('sale')) return 'up';
  return 'right';
}
// Vecchia geometria (larga, da un bordo all'altro del riquadro) — usata solo per radicali e pittogrammi, non toccata su richiesta
function arrowPathFor(dir){
  switch(dir){
    case 'left':  return 'M90,61 L30,61';
    case 'right': return 'M30,61 L90,61';
    case 'up':    return 'M60,92 L60,28';
    case 'down':  return 'M60,28 L60,92';
    case 'ccw':   return 'M88,61 A28,28 0 1 0 61,89';
    case 'cw':    return 'M32,61 A28,28 0 1 1 59,89';
    default:      return 'M30,61 L90,61';
  }
}
// Nuova geometria — la freccia resta dentro l'area occupata dal carattere, non attraversa tutto il riquadro
function arrowGeometryInside(dir, textY){
  const top=textY-46, bottom=textY-4, mid=textY-25, left=36, right=84, cx=60;
  switch(dir){
    case 'left':  return { d:`M${right},${mid} L${left},${mid}`, sx:right, sy:mid };
    case 'right': return { d:`M${left},${mid} L${right},${mid}`, sx:left, sy:mid };
    case 'up':    return { d:`M${cx},${bottom} L${cx},${top}`, sx:cx, sy:bottom };
    case 'down':  return { d:`M${cx},${top} L${cx},${bottom}`, sx:cx, sy:top };
    case 'ccw':   return { d:`M${right-4},${mid} A20,20 0 1 0 ${cx},${mid+20}`, sx:right-4, sy:mid };
    case 'cw':    return { d:`M${left+4},${mid} A20,20 0 1 1 ${cx},${mid+20}`, sx:left+4, sy:mid };
    default:      return { d:`M${left},${mid} L${right},${mid}`, sx:left, sy:mid };
  }
}
const TRACE_FONT = { ar:"'Noto Naskh Arabic',serif", zh:"'Noto Serif SC',serif", el:"'Noto Serif',serif", de:"'Fraunces',serif" };
const TRACE_DASH_NEW = '#C0392B';    // tratteggio rosso — arabo, cinese, greco, tedesco
const TRACE_DASH_LEGACY = '#9C9384'; // tratteggio grigio invariato — radicali e pittogrammi

function tracingTile(entry, code, accent, idx, style){
  style = style || 'new';
  const [ch, name, sound, howto] = entry;
  const arrowDir = directionArrow(howto);
  const markerId = 'arrowhead-'+code+'-'+idx;
  const isGrid = code==='zh';
  const guide = isGrid ? `
      <rect x="10" y="14" width="100" height="100" fill="none" stroke="#C9C2AF" stroke-width="1.5"/>
      <line x1="60" y1="14" x2="60" y2="114" stroke="#D8D2C0" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="10" y1="64" x2="110" y2="64" stroke="#D8D2C0" stroke-width="1" stroke-dasharray="4 3"/>` : `
      <line x1="8" y1="28" x2="112" y2="28" stroke="#D8D2C0" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="8" y1="72" x2="112" y2="72" stroke="#D8D2C0" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="8" y1="110" x2="112" y2="110" stroke="#B7AF9C" stroke-width="1.5"/>`;
  const textY = isGrid ? 92 : 104;

  let arrowSvg, dashColor;
  if(style==='legacy'){
    dashColor = TRACE_DASH_LEGACY;
    const arrowD = arrowPathFor(arrowDir);
    arrowSvg = `<path d="${arrowD}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round" opacity="0.8" marker-end="url(#${markerId})"/>`;
  } else {
    dashColor = TRACE_DASH_NEW;
    const {d:arrowD, sx, sy} = arrowGeometryInside(arrowDir, textY);
    arrowSvg = `
      <path d="${arrowD}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round" marker-end="url(#${markerId})"/>
      <circle cx="${sx}" cy="${sy}" r="7.5" fill="#fff" stroke="${accent}" stroke-width="1.5"/>
      <text x="${sx}" y="${sy+3.2}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${accent}" font-family="'Inter',sans-serif">1</text>`;
  }

  return `
    <div class="trace-tile">
      <svg viewBox="0 0 120 122" class="trace-svg">
        <defs>
          <marker id="${markerId}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="${accent}"/>
          </marker>
        </defs>
        ${guide}
        <text x="60" y="${textY}" text-anchor="middle" font-family="${TRACE_FONT[code]}" font-size="62" fill="none" stroke="${dashColor}" stroke-width="1.3" stroke-dasharray="3 3">${escapeHtml(ch)}</text>
        ${arrowSvg}
      </svg>
      <div class="trace-cap">${escapeHtml(ch)} <span class="trace-name">${escapeHtml(name)}</span>
        <button class="speak-btn" data-speak="${escapeHtml(ch)}" data-speak-lang="${code}" title="Ascolta">🔊</button>
      </div>
      <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:2px;">${escapeHtml(sound)}</div>
      <div class="trace-howto">${escapeHtml(howto)}</div>
    </div>`;
}

function toneCurvePath(curve){
  switch(curve){
    case 'flat':    return 'M15,35 L105,35';
    case 'rising':  return 'M15,60 L105,15';
    case 'dip':     return 'M15,40 C45,70 75,70 105,25';
    case 'falling': return 'M15,15 L105,60';
    case 'neutral': return 'M45,40 L75,40';
    default:        return 'M15,35 L105,35';
  }
}

function renderConjugationCard(code, accent){
  const c = CONJUGATIONS[code];
  if(!c) return '';
  const tenseBlocks = Object.entries(c.tenses).map(([tenseName, rows])=>`
    <h3 style="margin:18px 0 8px 0;font-size:13.5px;color:${accent};text-transform:uppercase;letter-spacing:.03em;">${escapeHtml(tenseName)}</h3>
    <div class="ff-wrap">
      <table class="sessions">
        <thead><tr><th></th>${c.verbs.map(v=>`<th>${escapeHtml(v)}</th>`).join('')}</tr></thead>
        <tbody>
          ${c.persons.map((p,i)=>`<tr><td>${escapeHtml(p)}</td>${rows[i].map(f=>`<td>${escapeHtml(f)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>`).join('');
  const impBlock = `
    <h3 style="margin:18px 0 8px 0;font-size:13.5px;color:${accent};text-transform:uppercase;letter-spacing:.03em;">Imperativo</h3>
    <div class="ff-wrap">
      <table class="sessions">
        <thead><tr><th></th>${c.verbs.map(v=>`<th>${escapeHtml(v)}</th>`).join('')}</tr></thead>
        <tbody>
          ${c.imperativePersons.map((p,i)=>`<tr><td>${escapeHtml(p)}</td>${c.imperative[i].map(f=>`<td>${escapeHtml(f)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  return `
    <div class="card">
      <h2>Coniugazioni verbali <span class="n">modelli regolari: ${c.verbs.map(v=>v.split(' ')[0]).join(', ')}</span></h2>
      ${tenseBlocks}
      ${impBlock}
    </div>`;
}

/* ---------------------------------------------------------------
   STORAGE HELPERS
--------------------------------------------------------------- */
async function loadKey(key, fallback){
  try{
    const { data, error } = await supabaseClient
      .from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? data.value : fallback;
  }catch(e){
    console.error('Errore di lettura', key, e);
    showStorageWarning();
    return fallback;
  }
}
async function saveKey(key, value){
  try{
    const { data:{ user } } = await supabaseClient.auth.getUser();
    if(!user) throw new Error('Utente non autenticato');
    const { error } = await supabaseClient
      .from('kv_store')
      .upsert({ user_id:user.id, key, value, updated_at:new Date().toISOString() }, { onConflict:'user_id,key' });
    if(error) throw error;
  }catch(e){
    console.error('Errore di salvataggio', key, e);
    showStorageWarning();
  }
}
function showToast(message){
  const existing = document.getElementById('app-toast');
  if(existing) existing.remove();
  const w = document.createElement('div');
  w.id = 'app-toast';
  w.style.cssText = 'position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;background:#B23A2E;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 8px 22px rgba(0,0,0,.2);';
  w.textContent = message;
  document.body.appendChild(w);
  setTimeout(()=>w.remove(), 6000);
}
function showStorageWarning(){
  showToast('Il salvataggio non è riuscito. Controlla la connessione e riprova.');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function seedWords(code){
  await ensureLangLoaded(code);
  const data = cache.lang[code];
  const existing = new Set(data.words.map(w=>w.term));
  let added = 0;
  SEED_WORDS[code].forEach(([term, translation, family, note])=>{
    if(!existing.has(term)){
      data.words.push({id:uid(), term, translation, family, note: note||'', date:new Date().toISOString()});
      existing.add(term);
      added++;
    }
  });
  await saveKey('lang:'+code, data);
  return added;
}
async function seedGrammar(code){
  await ensureLangLoaded(code);
  const data = cache.lang[code];
  const existing = new Set(data.grammar.map(g=>g.title));
  let added = 0;
  SEED_GRAMMAR[code].forEach(([title, content])=>{
    if(!existing.has(title)){
      data.grammar.push({id:uid(), title, content, date:new Date().toISOString()});
      existing.add(title);
      added++;
    }
  });
  await saveKey('lang:'+code, data);
  return added;
}

/* in-memory cache, lazy-loaded per language */
const cache = { lang:{}, sessions:{}, ff:null, frAudio:null, frPhoto:null };

async function ensureLangLoaded(code){
  if(!cache.lang[code]) cache.lang[code] = await loadKey('lang:'+code, {words:[], grammar:[]});
  if(!cache.sessions[code]) cache.sessions[code] = await loadKey('sessions:'+code, []);
}
async function ensureFFLoaded(){ if(!cache.ff) cache.ff = await loadKey('spanish:false-friends', []); }
async function ensureFrLoaded(){
  if(!cache.frAudio) cache.frAudio = await loadKey('french:audio', []);
  if(!cache.frPhoto) cache.frPhoto = await loadKey('french:photo', []);
}

/* ---------------------------------------------------------------
   TIMER (single global timer across languages)
--------------------------------------------------------------- */
const timer = { running:false, code:null, client:'', rate:0, startTs:null, intervalId:null };

function fmtDuration(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
}
function startTimer(code, client, rate){
  if(timer.running) return;
  timer.running = true; timer.code = code; timer.client = client||'Studio personale';
  timer.rate = parseFloat(rate)||0; timer.startTs = Date.now();
  timer.intervalId = setInterval(tickTimer, 1000);
  tickTimer();
  renderSidebar();
}
async function stopTimer(){
  if(!timer.running) return;
  const code = timer.code;
  const durationSec = Math.max(1, Math.round((Date.now()-timer.startTs)/1000));
  await ensureLangLoaded(code);
  cache.sessions[code].unshift({
    id:uid(), client:timer.client, rate:timer.rate,
    date:new Date().toISOString(), durationSec
  });
  await saveKey('sessions:'+code, cache.sessions[code]);
  clearInterval(timer.intervalId);
  timer.running=false; timer.code=null; timer.intervalId=null;
  renderSidebar();
  if(currentView===code) renderLangPage(code);
}
function tickTimer(){
  if(currentView===timer.code){
    const el = document.getElementById('timer-display');
    if(el) el.textContent = fmtDuration((Date.now()-timer.startTs)/1000);
  }
}

  });
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>supabaseClient.auth.signOut());
}

async function navigateTo(view){
  currentView = view;
  const bar = document.getElementById('accent-bar');
  if(bar) bar.style.background = view==='home' ? 'var(--ink)' : (LANGS[view]?.accent || 'var(--ink)');
  renderSidebar();
  if(view==='home') return renderHome();
  if(view==='es') return renderSpanish();
  if(view==='fr') return renderFrench();
  return renderLangPage(view);
}

    <div class="card">

        <div class="timer-box">

            <div class="timer-display mono" id="timer-display">00:00:00</div>
            <div class="timer-status">In corso · cliente: ${escapeHtml(timer.client)} · € ${timer.rate}/h</div>

          <button class="btn btn-primary" style="background:#B23A2E" data-action="stop-timer">Ferma sessione</button>

      ` : `
        <form class="form-row" data-form="start-timer">
          <div class="field">
            <label>Nome cliente</label>
            <input name="client" placeholder="Studio personale">
          </div>
          <div class="field">
            <label>Tariffa oraria (€)</label>
            <input name="rate" type="number" min="0" step="0.5" placeholder="0">
          </div>
          <div class="field">
            <label>Lingua</label>
            <input value="${conf.name}" disabled style="color:var(--text-faint);min-width:120px;">
          </div>

          </button>

      `}

      <h2 style="margin-top:24px;">Cronologia sessioni</h2>
      ${sessions.length===0 ? `<div class="empty-state">Nessuna sessione registrata ancora.</div>` : `
        <table class="sessions">
          <thead><tr><th>Data</th><th>Cliente</th><th>Tariffa</th><th>Durata</th><th>Valore</th></tr></thead>
          <tbody>
            ${sessions.map(s=>`
              <tr>
                <td>${new Date(s.date).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})}</td>
                <td>${escapeHtml(s.client)}</td>
                <td class="num">€ ${s.rate.toFixed(2)}/h</td>
                <td class="num">${fmtDuration(s.durationSec)}</td>
                <td class="num">€ ${((s.durationSec/3600)*s.rate).toFixed(2)}</td>
              </tr>`).join('')}
          </tbody>
        </table>`}
    </div>
  `;

  // events
  page.querySelector('[data-form="add-word"]').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    data.words.push({id:uid(), term:fd.get('term').trim(), translation:fd.get('translation').trim(), family:fd.get('family'), note:(fd.get('note')||'').trim(), date:new Date().toISOString()});
    await saveKey('lang:'+code, data);
    renderLangPage(code);
  });
  page.querySelector('[data-form="add-grammar"]').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    data.grammar.unshift({id:uid(), title:fd.get('title').trim(), content:fd.get('content').trim(), date:new Date().toISOString()});
    await saveKey('lang:'+code, data);
    renderLangPage(code);
  });
  const timerForm = page.querySelector('[data-form="start-timer"]');
  if(timerForm){
    timerForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      startTimer(code, fd.get('client'), fd.get('rate'));
      renderLangPage(code);
    });
  }
  const stopBtn = page.querySelector('[data-action="stop-timer"]');
  if(stopBtn) stopBtn.addEventListener('click', stopTimer);

  const seedWordsBtn = page.querySelector('[data-action="seed-words"]');
  if(seedWordsBtn) seedWordsBtn.addEventListener('click', async ()=>{
    seedWordsBtn.disabled = true; seedWordsBtn.textContent = 'Carico…';
    const added = await seedWords(code);
    renderLangPage(code);
  });
  const seedGrammarBtn = page.querySelector('[data-action="seed-grammar"]');
  if(seedGrammarBtn) seedGrammarBtn.addEventListener('click', async ()=>{
    seedGrammarBtn.disabled = true; seedGrammarBtn.textContent = 'Carico…';
    const added = await seedGrammar(code);
    renderLangPage(code);
  });

  page.querySelectorAll('[data-del-word]').forEach(b=>b.addEventListener('click', async ()=>{
    data.words = data.words.filter(w=>w.id!==b.dataset.delWord);
    await saveKey('lang:'+code, data);
    renderLangPage(code);
  }));
  page.querySelectorAll('[data-del-grammar]').forEach(b=>b.addEventListener('click', async ()=>{
    data.grammar = data.grammar.filter(g=>g.id!==b.dataset.delGrammar);
    await saveKey('lang:'+code, data);
    renderLangPage(code);
  }));

  page.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click', ()=>{
    speakWord(b.dataset.speak, b.dataset.speakLang);
  }));
}

      <h1>${LANGS.es.name}</h1>

      <div class="ff-wrap">
        <table class="ff">
          <tr><th>Spagnolo</th>${list.map(f=>`<td>${escapeHtml(f.es)}</td>`).join('')}</tr>
          <tr><th>Italiano</th>${list.map(f=>`<td>${escapeHtml(f.it)}</td>`).join('')}</tr>
          <tr class="actions"><th></th>${list.map(f=>`<td><button class="btn-danger" data-del-ff="${f.id}">✕ elimina</button></td>`).join('')}</tr>
        </table>
      </div>`}
    </div>

    ${renderConjugationCard('es', LANGS.es.accent)}
  `;

  const seedFfBtn = page.querySelector('[data-action="seed-ff"]');
  if(seedFfBtn) seedFfBtn.addEventListener('click', async ()=>{
    seedFfBtn.disabled = true; seedFfBtn.textContent = 'Carico…';
    const existing = new Set(list.map(f=>f.es));
    SEED_FALSE_FRIENDS.forEach(([es,it])=>{
      if(!existing.has(es)){
        list.push({id:uid(), es, it});
        existing.add(es);
      }
    });
    await saveKey('spanish:false-friends', list);
    renderSpanish();
  });

  page.querySelector('[data-form="add-ff"]').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    list.push({id:uid(), es:fd.get('es').trim(), it:fd.get('it').trim()});
    await saveKey('spanish:false-friends', list);
    renderSpanish();
  });
  page.querySelectorAll('[data-del-ff]').forEach(b=>b.addEventListener('click', async ()=>{
    cache.ff = list.filter(f=>f.id!==b.dataset.delFf);
    await saveKey('spanish:false-friends', cache.ff);
    renderSpanish();
  }));
}

          cache.frPhoto.map(t=>`
            <div class="item">
              <div class="date">${new Date(t.date).toLocaleString('it-IT')} <button class="btn-danger" data-del-photo="${t.id}" style="float:right;">✕ elimina</button></div>
              <div>${escapeHtml(t.text)}</div>
            </div>`).join('')}
      </div>
    </div>

    ${renderConjugationCard('fr', LANGS.fr.accent)}
  `;

  // delete handlers
  page.querySelectorAll('[data-del-audio]').forEach(b=>b.addEventListener('click', async ()=>{
    cache.frAudio = cache.frAudio.filter(t=>t.id!==b.dataset.delAudio);
    await saveKey('french:audio', cache.frAudio);
    renderFrench();
  }));
  page.querySelectorAll('[data-del-photo]').forEach(b=>b.addEventListener('click', async ()=>{
    cache.frPhoto = cache.frPhoto.filter(t=>t.id!==b.dataset.delPhoto);
    await saveKey('french:photo', cache.frPhoto);
    renderFrench();
  }));

  // speech recognition
  if(SR){
    const recBtn = document.getElementById('rec-btn');
    const recDot = document.getElementById('rec-dot');
    const recLabel = document.getElementById('rec-label');
    const liveBox = document.getElementById('live-transcript');
    const saveBtn = document.getElementById('save-transcript');

    recBtn.addEventListener('click', ()=>{
      if(!recognizing){
        recognition = new SR();
        recognition.lang = 'fr-FR';
        recognition.continuous = true;
        recognition.interimResults = true;
        liveTranscript = '';
        finalChunks = [];
        recognition.onresult = (ev)=>{
          let interim = '';
          for(let i=0;i<ev.results.length;i++){
            const r = ev.results[i];
            if(r.isFinal) finalChunks[i] = r[0].transcript.trim();
            else interim += r[0].transcript;
          }
          liveTranscript = finalChunks.filter(Boolean).join(' ');
          liveBox.textContent = (liveTranscript + ' ' + interim).trim() || '...';
          saveBtn.disabled = liveTranscript.trim().length===0;
        };
        recognition.onerror = ()=>{ stopRecording(); };
        recognition.onend = ()=>{ if(recognizing) stopRecording(); };
        recognition.start();
        recognizing = true;
        recDot.classList.add('on');
        recLabel.textContent = 'Ferma registrazione';
      } else {
        stopRecording();
      }
    });
    function stopRecording(){
      recognizing = false;
      recDot.classList.remove('on');
      recLabel.textContent = 'Avvia registrazione';
      if(recognition) recognition.stop();
    }
    saveBtn.addEventListener('click', async ()=>{
      const text = liveTranscript.trim();
      if(!text) return;
      cache.frAudio.unshift({id:uid(), text, date:new Date().toISOString()});
      await saveKey('french:audio', cache.frAudio);
      liveTranscript = '';
      renderFrench();
    });
  }

  // photo OCR
  const photoInput = document.getElementById('photo-input');
  const photoTranscript = document.getElementById('photo-transcript');
  const savePhotoBtn = document.getElementById('save-photo');
  let currentPhotoText = '';

  photoInput.addEventListener('change', async ()=>{
    const file = photoInput.files[0];
    if(!file) return;
    photoTranscript.style.display = 'block';
    photoTranscript.textContent = 'Lettura del testo in corso... 0%';
    savePhotoBtn.style.display = 'none';
    try{
      const text = await transcribeImage(file, pct=>{
        photoTranscript.textContent = 'Lettura del testo in corso... '+pct+'%';
      });
      currentPhotoText = text;
      photoTranscript.textContent = text || '(nessun testo trovato — prova con una foto più nitida e ben illuminata)';
      savePhotoBtn.style.display = text ? 'inline-block' : 'none';
    }catch(err){
      photoTranscript.textContent = 'Non è stato possibile leggere il testo. Riprova con un\'altra foto.';
      console.error(err);
    }
  });
  savePhotoBtn.addEventListener('click', async ()=>{
    if(!currentPhotoText) return;
    cache.frPhoto.unshift({id:uid(), text:currentPhotoText, date:new Date().toISOString()});
    await saveKey('french:photo', cache.frPhoto);
    renderFrench();
  });
}

let ocrWorker = null;
async function transcribeImage(file, onProgress){
  if(typeof Tesseract === 'undefined'){
    throw new Error('Libreria OCR non caricata. Controlla la connessione e ricarica la pagina.');
  }
  if(!ocrWorker){
    ocrWorker = await Tesseract.createWorker('fra', 1, {
      logger: m=>{
        if(onProgress && m.status==='recognizing text') onProgress(Math.round((m.progress||0)*100));
      }
    });
  }
  const { data } = await ocrWorker.recognize(file);
  return (data.text||'').trim();
}

/* ---------------------------------------------------------------
   UTIL
--------------------------------------------------------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------------------------------------------------------
   AUTENTICAZIONE — stesso account su tutti i dispositivi
--------------------------------------------------------------- */
function renderLogin(prefillEmail, errorMsg){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>Palestra delle Lingue</h1>
        <p>Accedi con la stessa email e password su ogni dispositivo per ritrovare sempre le stesse parole e sessioni.</p>
        <form id="login-form">
          <div class="field"><label>Email</label><input type="email" name="email" required value="${prefillEmail||''}"></div>
          <div class="field"><label>Password</label><input type="password" name="password" required minlength="6"></div>
          <button class="btn btn-primary" style="background:var(--ink)" type="submit" id="login-btn">Accedi</button>
          <button class="btn btn-ghost" type="button" id="signup-btn" style="margin-top:8px;">Non ho un account: registrami</button>
        </form>
        <div class="login-error" id="login-error">${errorMsg||''}</div>
      </div>
    </div>`;
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    errorBox.textContent = 'Accesso in corso…';
    const { error } = await supabaseClient.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
    if(error) errorBox.textContent = 'Accesso non riuscito: '+error.message;
  });
  document.getElementById('signup-btn').addEventListener('click', async ()=>{
    const fd = new FormData(form);
    if(!fd.get('email') || !fd.get('password')){ errorBox.textContent = 'Inserisci email e password, poi premi di nuovo.'; return; }
    errorBox.textContent = 'Registrazione in corso…';
    const { error } = await supabaseClient.auth.signUp({ email: fd.get('email'), password: fd.get('password') });
    if(error){ errorBox.textContent = 'Registrazione non riuscita: '+error.message; return; }
    errorBox.textContent = 'Account creato! Se richiesto, controlla la tua email per confermare, poi accedi.';
  });
}

let appStarted = false;
async function initAuthAndApp(){
  const { data:{ session } } = await supabaseClient.auth.getSession();
  if(session){ startApp(); appStarted = true; } else renderLogin();
  supabaseClient.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_IN'){
      if(!appStarted){ startApp(); appStarted = true; }
      // altrimenti è solo un rinnovo automatico della sessione già attiva
      // (succede quando torni sulla scheda): non tocchiamo la pagina corrente
    }
    if(event==='SIGNED_OUT'){
      appStarted = false;
      cache.lang = {}; cache.sessions = {}; cache.ff = null; cache.frAudio = null; cache.frPhoto = null; cache.photo = {};
      renderLogin();
    }
  });
}
function startApp(){
  shell();
  renderHome();
}

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
initAuthAndApp();
</script>
